server.port=8080

spring.application.name=microservicio-gateway

spring.cloud.gateway.discovery.locator.enable=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.routes[0].id=microservicio-usuario
spring.cloud.gateway.routes[0].uri=http://localhost:8085
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/usuario/**

spring.cloud.gateway.routes[1].id=microservicio-participante
spring.cloud.gateway.routes[1].uri=http://localhost:8086
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/participante/**

spring.cloud.gateway.routes[2].id=microservicio-dato
spring.cloud.gateway.routes[2].uri=http://localhost:8087
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/datoparticipante/**

spring.cloud.gateway.routes[3].id=microservicio-patologia
spring.cloud.gateway.routes[3].uri=http://localhost:8088
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/patologia/**

spring.cloud.gateway.routes[4].id=microservicio-sennal
spring.cloud.gateway.routes[4].uri=http://localhost:8089
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/sennal/**

spring.config.import=optional:configserver:http://localhost:8888

eureka.server.port=8761
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:${eureka.server.port}/eureka/

management.endpoint.gateway.enabled=true
management.endpoints.web.exposure.include= *

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
