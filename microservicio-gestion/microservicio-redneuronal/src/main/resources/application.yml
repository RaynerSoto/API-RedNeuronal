server:
  port: 8092

spring:
  application:
    name: microservicio-redneuronal
  datasource:
    url: jdbc:postgresql:${RedNeuronalBDURL}
    username: ${DB_USER}
    password: ${BD_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 600000
  jpa:
    format-sql: true
    show-sql: true
    hibernate:
      ddl-auto: update
      properties:
        hibernate:
          format_sql: true
          javax:
            persistence:
              query:
                timeout: 60000
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    api-docs:
      path: /api-docs

logging:
  level:
    org:
      springframework:
        web: DEBUG
        web:
          filter:
            CommonsRequestLoggingFilter: DEBUG
