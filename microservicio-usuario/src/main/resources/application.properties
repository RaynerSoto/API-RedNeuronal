server.port= 8085

spring.application.name= microservicio-usuario
spring.datasource.url=jdbc:postgresql://localhost:5432/Sensores_inteligentes
spring.datasource.username=postgres
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=600000

spring.jpa.format-sql=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.properties.hibernate.format_sql=true
spring.jpa.hibernate.properties.hibernate.javax.persistence.query.timeout=60000
spring.jpa.database=postgresql
spring.jpa.database-platform= org.hibernate.dialect.PostgreSQLDialect
spring.config.import= optional:configserver:http://localhost:8888

eureka.instance.hostname.localhost
eureka.client.server-url.defaultZone: http://localhost:8761/eureka/
eureka.client.enabled=false

springdoc.swagger-ui.path= /swagger-ui.html
springdoc.swagger-ui.api-docs.path= /api-docs

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG