server:
  port: 9090

spring:
  application:
    name: microservicio-usuario
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql:${SensoresBDURL}
    username: ${BD_USER}
    password: ${BD_PASS}
    hikari:
      connection-timeout: 60000
  jpa:
    format-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        javax:
          persistence:
            query:
              timeout: 60000
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  config:
    import: optional:configserver:http://localhost:8080

eureka:
  instance:
    hostname: localhost
  client:
    server-url:
      defaultZone: http://localhost:8761/eureka/
